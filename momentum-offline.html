<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Momentum</title>
<style>
  :root {
    --bg: #17162a;
    --bg-2: #1f1d38;
    --surface: #232141;
    --moon: #f5e6c8;
    --moon-soft: #d9c9a0;
    --ash: #423f60;
    --ash-light: #605c82;
    --blush: #d9a3b8;
    --sage: #a8d8c9;
    --lavender: #b8aedb;
    --text: #f0ece4;
    --text-dim: #8f8aa8;
    --font-display: Georgia, 'Iowan Old Style', 'Palatino Linotype', 'Book Antiqua', serif;
    --font-body: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
    --font-mono: ui-monospace, 'SF Mono', 'Cascadia Code', 'Roboto Mono', Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: #0c0b16; }
  body { font-family: var(--font-body); color: var(--text); display: flex; justify-content: center; padding: 16px; }

  #app {
    background: radial-gradient(ellipse at 25% -10%, #2b2750 0%, var(--bg) 60%);
    color: var(--text);
    border-radius: 20px;
    padding: 26px 22px 30px;
    max-width: 640px;
    width: 100%;
    box-sizing: border-box;
    position: relative;
    overflow: hidden;
    min-height: 560px;
    transition: background 4s ease;
  }
  .sky-deco {
    position: absolute; inset: 0; pointer-events: none; z-index: 0;
    background-image:
      radial-gradient(1.5px 1.5px at 12% 15%, var(--moon-soft), transparent),
      radial-gradient(1.5px 1.5px at 82% 10%, var(--moon-soft), transparent),
      radial-gradient(1px 1px at 60% 25%, var(--moon-soft), transparent),
      radial-gradient(1.5px 1.5px at 30% 40%, var(--moon-soft), transparent),
      radial-gradient(1px 1px at 92% 45%, var(--moon-soft), transparent),
      radial-gradient(1px 1px at 45% 8%, var(--moon-soft), transparent);
    opacity: 0.45;
    animation: twinkle 8s ease-in-out infinite;
  }
  @keyframes twinkle { 0%,100% { opacity: 0.3; } 50% { opacity: 0.55; } }
  .sky-cloud {
    position: absolute; border-radius: 50%; filter: blur(6px); pointer-events: none; z-index: 0;
    background: radial-gradient(ellipse, rgba(184,174,219,0.12), rgba(184,174,219,0) 70%);
    animation: driftslow 90s ease-in-out infinite;
  }
  @keyframes driftslow { 0%,100% { transform: translateX(0); } 50% { transform: translateX(24px); } }
  #app > *:not(.sky-deco):not(.sky-cloud) { position: relative; z-index: 1; }

  .fraunces { font-family: var(--font-display); font-style: italic; }
  .mono { font-family: var(--font-mono); }
  a { color: inherit; }

  .header { display: flex; align-items: center; gap: 18px; margin-bottom: 6px; }

  .header-text h1 { font-size: 22px; margin: 0 0 2px; font-weight: 600; }
  .header-sub { font-size: 12px; color: var(--text-dim); }
  .header-stats { font-size: 11.5px; color: var(--text-dim); margin-top: 3px; }

  .theme-line {
    width: 100%; background: none; border: none; border-bottom: 1px solid var(--ash);
    padding: 6px 2px; color: var(--text); font-family: var(--font-display); font-style: italic;
    font-size: 15px; margin: 16px 0 20px;
  }
  .theme-line::placeholder { color: var(--text-dim); }
  .theme-line:focus { outline: none; border-bottom-color: var(--moon-soft); }

  .nav-tabs { display: flex; gap: 6px; margin-bottom: 18px; }
  .nav-tab {
    background: none; border: none; color: var(--text-dim); font-size: 12.5px; font-weight: 600;
    cursor: pointer; font-family: inherit; padding: 4px 0; margin-right: 16px; border-bottom: 2px solid transparent;
  }
  .nav-tab.active { color: var(--text); border-bottom-color: var(--moon-soft); }

  .task-list { margin-bottom: 6px; }
  .task-row {
    display: flex; align-items: center; gap: 10px; padding: 10px 4px;
    border-bottom: 1px solid rgba(255,255,255,0.05); cursor: pointer;

  .task-row:last-child { border-bottom: none; }
  .cat-dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }
  .task-check {
    width: 19px; height: 19px; border-radius: 50%; border: 2px solid var(--ash-light);
    flex-shrink: 0; display: flex; align-items: center; justify-content: center;
    font-size: 10px; background: transparent;
  }
  .task-check.done { background: var(--moon); border-color: var(--moon); color: var(--bg); }
  .task-check.missed { background: transparent; border-color: var(--blush); color: var(--blush); }
  .task-time { font-family: var(--font-mono); font-size: 10.5px; color: var(--text-dim); width: 38px; flex-shrink: 0; }
  .task-title { flex: 1; font-size: 13.5px; }
  .task-title.done { color: var(--text-dim); text-decoration: line-through; }
  .task-title.missed { color: var(--blush); }
  .task-caret { color: var(--text-dim); font-size: 11px; flex-shrink: 0; }

  .task-detail {
    padding: 10px 4px 16px 33px; display: flex; flex-direction: column; gap: 10px;
    border-bottom: 1px solid rgba(255,255,255,0.05);
  }
  .detail-label { font-size: 10px; letter-spacing: 0.05em; text-transform: uppercase; color: var(--text-dim); display: block; margin-bottom: 3px; }
  .detail-row { display: flex; gap: 8px; flex-wrap: wrap; }
  .detail-row > div { flex: 1; min-width: 120px; }
  .detail-actions { display: flex; gap: 14px; margin-top: 2px; }
  .detail-actions button {
    background: none; border: none; color: var(--text-dim); font-size: 11.5px; cursor: pointer; font-family: inherit;
    text-decoration: underline; padding: 0;
  }
  .detail-actions button:hover { color: var(--text); }

  input[type=text], input[type=time], input[type=url], input[type=date], input[type=number],
  select, textarea {
    background: var(--bg-2); border: 1px solid var(--ash); border-radius: 10px;
    padding: 7px 10px; color: var(--text); font-family: inherit; font-size: 12.5px; width: 100%;
  }
  textarea { resize: vertical; }

  .quick-add { display: flex; gap: 8px; margin: 14px 0 4px; }
  .quick-add input[type=time] { width: 84px; flex-shrink: 0; }
  .quick-add input[type=text] { flex: 1; }
  button.primary {
    background: var(--moon); color: #241d08; border: none; border-radius: 10px;
    padding: 7px 14px; font-weight: 600; font-size: 12.5px; cursor: pointer; font-family: inherit; flex-shrink: 0;
  }
  button.ghost {
    background: none; border: 1px solid var(--ash); color: var(--text-dim);

  .toggle-line {

    display: inline-block; margin: 10px 12px 0 0;

  .toggle-line:hover { color: var(--text); }

  .goal-bar-fill { background: var(--moon-soft); height: 100%; }
  .goal-importance { font-family: var(--font-mono); font-size: 11px; color: var(--text-dim); width: 22px; text-align: right; flex-shrink: 0; }
  .goals-filter { display: flex; gap: 14px; margin-bottom: 14px; }
  .offline-note { font-size: 10.5px; color: var(--text-dim); text-align: center; margin-top: 18px; opacity: 0.7; }
</style>

function defaultState() {

    date: todayStr(), points: 0, streak: 0, bestStreak: 0,

  };
}

function getCycleInfo(cycle) {
  if (!cycle || !cycle.lastStart) return null;
  const last = new Date(cycle.lastStart + "T00:00:00");
  const today = new Date(todayStr() + "T00:00:00");
  const diffDays = Math.round((today - last) / 86400000);
  const cycleLen = cycle.cycleLength || 28;
  const periodLen = cycle.periodLength || 5;
  const cycleDay = (((diffDays % cycleLen) + cycleLen) % cycleLen) + 1;
  const ovulationDay = Math.max(periodLen + 2, cycleLen - 14);
  let phase, pct;
  if (cycleDay <= periodLen) { phase = "Menstrual"; pct = 0; }
  else if (cycleDay < ovulationDay) { phase = "Follicular"; pct = Math.round(((cycleDay - periodLen) / (ovulationDay - periodLen)) * 55); }
  else if (cycleDay <= ovulationDay + 1) { phase = "Ovulation"; pct = 100; }
  else {
    phase = "Luteal";
    const lutealLen = Math.max(1, cycleLen - (ovulationDay + 1));
    const prog = cycleDay - (ovulationDay + 1);
    pct = Math.round(100 - (prog / lutealLen) * 100);
  }
  return { cycleDay, phase, pct: Math.max(0, Math.min(100, pct)) };
}

/* ---------- astronomy: sunrise/sunset + prayer times (no network, pure math) ---------- */
function getSunTimes(lat, lon, date) {
  const rad = Math.PI/180;
  const dayOfYear = Math.floor((date - new Date(date.getFullYear(),0,0)) / 86400000);
  const lngHour = lon / 15;
  function calc(isSunrise) {
    const t = dayOfYear + ((isSunrise?6:18) - lngHour)/24;
    const M = 0.9856*t - 3.289;
    let L = M + 1.916*Math.sin(M*rad) + 0.020*Math.sin(2*M*rad) + 282.634;
    L = (L+360)%360;
    let RA = (1/rad)*Math.atan(0.91764*Math.tan(L*rad));
    RA = (RA+360)%360;
    const Lq = Math.floor(L/90)*90, RAq = Math.floor(RA/90)*90;
    RA = (RA + (Lq - RAq)) / 15;
    const sinDec = 0.39782*Math.sin(L*rad);
    const cosDec = Math.cos(Math.asin(sinDec));
    const cosH = (Math.cos(90.833*rad) - sinDec*Math.sin(lat*rad)) / (cosDec*Math.cos(lat*rad));
    if (cosH > 1 || cosH < -1) return null;
    let H = isSunrise ? 360 - (1/rad)*Math.acos(cosH) : (1/rad)*Math.acos(cosH);
    H = H/15;
    const T = H + RA - 0.06571*t - 6.622;
    return ((T - lngHour) + 24) % 24;
  }
  const sunriseUT = calc(true), sunsetUT = calc(false);
  if (sunriseUT == null || sunsetUT == null) return null;
  const utcMidnight = Date.UTC(date.getFullYear(), date.getMonth(), date.getDate());
  return { sunrise: new Date(utcMidnight + sunriseUT*3600000), sunset: new Date(utcMidnight + sunsetUT*3600000) };
}
function hexToRgb(hex) { hex = hex.replace('#',''); return { r:parseInt(hex.substr(0,2),16), g:parseInt(hex.substr(2,2),16), b:parseInt(hex.substr(4,2),16) }; }
function lerpHex(hex1, hex2, t) {
  t = Math.max(0, Math.min(1, t));
  const c1 = hexToRgb(hex1), c2 = hexToRgb(hex2);
  return `rgb(${Math.round(c1.r+(c2.r-c1.r)*t)},${Math.round(c1.g+(c2.g-c1.g)*t)},${Math.round(c1.b+(c2.b-c1.b)*t)})`;
}
const SKY = {
  night: { center:"#2b2750", edge:"#17162a" },
  dawn:  { center:"#caa06e", edge:"#3a3560" },
  day:   { center:"#6b7bb0", edge:"#3d4a78" },
  dusk:  { center:"#c97a52", edge:"#4a3a68" },
};
function getSkyColors(now, sunTimes) {
  if (!sunTimes) return SKY.night;
  const WINDOW = 60*60*1000;
  const tNow = now.getTime(), tSunrise = sunTimes.sunrise.getTime(), tSunset = sunTimes.sunset.getTime();
  const blend = (a,b,t) => ({ center: lerpHex(a.center,b.center,t), edge: lerpHex(a.edge,b.edge,t) });
  if (tNow < tSunrise - WINDOW) return SKY.night;
  if (tNow < tSunrise) return blend(SKY.night, SKY.dawn, (tNow-(tSunrise-WINDOW))/WINDOW);
  if (tNow < tSunrise + WINDOW) return blend(SKY.dawn, SKY.day, (tNow-tSunrise)/WINDOW);
  if (tNow < tSunset - WINDOW) return SKY.day;
  if (tNow < tSunset) return blend(SKY.day, SKY.dusk, (tNow-(tSunset-WINDOW))/WINDOW);
  if (tNow < tSunset + WINDOW) return blend(SKY.dusk, SKY.night, (tNow-tSunset)/WINDOW);
  return SKY.night;
}
function solarPosition(date) {
  const rad = Math.PI/180;
  const J2000 = Date.UTC(2000,0,1,12,0,0);
  const n = (date.getTime() - J2000) / 86400000;
  const L = (280.460 + 0.9856474*n) % 360;
  const g = ((357.528 + 0.9856003*n) % 360) * rad;
  const lambda = (L + 1.915*Math.sin(g) + 0.020*Math.sin(2*g)) * rad;
  const eps = (23.439 - 0.0000004*n) * rad;
  const decl = Math.asin(Math.sin(eps) * Math.sin(lambda)) / rad;
  let RA = Math.atan2(Math.cos(eps)*Math.sin(lambda), Math.cos(lambda)) / rad;
  RA = ((RA % 360) + 360) % 360;
  let eqt = (L - RA) * 4;
  if (eqt > 20) eqt -= 1440;
  if (eqt < -20) eqt += 1440;
  return { decl, eqt };
}
function hourAngle(lat, decl, angle, mode) {
  const rad = Math.PI/180;
  const num = mode === "altitude"
    ? Math.sin(angle*rad) - Math.sin(lat*rad)*Math.sin(decl*rad)
    : -Math.sin(angle*rad) - Math.sin(lat*rad)*Math.sin(decl*rad);
  const den = Math.cos(lat*rad) * Math.cos(decl*rad);
  const cosH = num/den;
  if (cosH > 1 || cosH < -1 || isNaN(cosH)) return null;
  return Math.acos(cosH) / rad / 15;
}
function getPrayerTimes(lat, lon, date, opts) {
  const o = Object.assign({ fajrAngle: 18, ishaAngle: 17, asrFactor: 2 }, opts || {}); // Hanafi Asr
  const { decl, eqt } = solarPosition(date);
  const solarNoonUTC = 12 - (lon/15) - (eqt/60);
  const tFajr = hourAngle(lat, decl, o.fajrAngle, "depression");
  const tSun = hourAngle(lat, decl, 0.833, "depression");
  const rad = Math.PI/180;
  const asrAngle = Math.atan(1 / (o.asrFactor + Math.tan(Math.abs(lat - decl)*rad))) / rad;
  const tAsr = hourAngle(lat, decl, asrAngle, "altitude");
  const tIsha = hourAngle(lat, decl, o.ishaAngle, "depression");
  if ([tFajr,tSun,tAsr,tIsha].some(t => t == null)) return null;
  const toDate = (utcHours) => new Date(Date.UTC(date.getFullYear(),date.getMonth(),date.getDate()) + utcHours*3600000);
  return {
    fajr: toDate(solarNoonUTC - tFajr), sunrise: toDate(solarNoonUTC - tSun),
    dhuhr: toDate(solarNoonUTC + 0.05), asr: toDate(solarNoonUTC + tAsr),
    maghrib: toDate(solarNoonUTC + tSun), isha: toDate(solarNoonUTC + tIsha),
  };
}
function fmtTime(d) { return String(d.getHours()).padStart(2,"0") + ":" + String(d.getMinutes()).padStart(2,"0"); }
const FALLBACK_COORDS = { lat: 40.7895, lon: -74.0565 };

const APP_PACKAGES = {
  "muslimpro": "com.bitsmedia.android.muslimpro",
  "snapcalorie": "com.snapcalorie.alpha002",
};
function appLaunchUrl(name) {
  const key = (name || "").toLowerCase().replace(/[^a-z0-9]/g, "");
  const pkg = APP_PACKAGES[key];
  if (pkg) {
    const fallback = encodeURIComponent(`https://play.google.com/store/apps/details?id=${pkg}`);
    return `intent://#Intent;action=android.intent.action.MAIN;category=android.intent.category.LAUNCHER;package=${pkg};S.browser_fallback_url=${fallback};end`;
  }
  return `https://play.google.com/store/search?q=${encodeURIComponent(name)}&c=apps`;
}

/* ---------- app state ---------- */
let state = loadState() || defaultState();
if (!state.cycle) state.cycle = { lastStart: "", cycleLength: 28, periodLength: 5 };
if (!state.lifeGoals) state.lifeGoals = JSON.parse(JSON.stringify(DEFAULT_LIFE_GOALS));
if (state.date !== todayStr()) {
  const daysSince = Math.round((new Date(todayStr()) - new Date(state.date)) / 86400000);
  if (daysSince > 1) state.streak = 0;
  state.date = todayStr();
  state.tasks = [];
}
if (state.autoFilledDate !== todayStr() && state.tasks.length === 0) {
  const fresh = buildTodayTasks(state.nextOrder);
  state.tasks = fresh;
  state.nextOrder += fresh.length;
  state.autoFilledDate = todayStr();
}
saveState();

let coords = loadGeo();
let view = "focus";
let expandedId = null;
let showCycle = false;
let showTimer = false;
let showAdvancedAdd = false;
let goalFilter = "all";
let reflectOpen = false;
const catMap = Object.fromEntries(CATEGORIES.map(c => [c.id, c]));

const FOCUS_LEN = 25*60, BREAK_LEN = 5*60;
let timeLeft = FOCUS_LEN, running = false, tMode = "focus", timerInterval = null;

/* ---------- derived values ---------- */
function computed() {
  const total = state.tasks.length;
  const doneCount = state.tasks.filter(t=>t.done).length;
  const pct = total === 0 ? 0 : Math.round((doneCount/total)*100);
  const linkedCompletedToday = state.tasks.filter(t => t.done && t.goalId != null).length;
  const alignmentPct = doneCount === 0 ? 0 : Math.round((linkedCompletedToday / doneCount) * 100);
  const sortedTasks = [...state.tasks].sort((a,b) => (a.time||"99:99").localeCompare(b.time||"99:99") || a.order-b.order);
  const focusQueue = sortedTasks.filter(t => !t.done && !t.missed);
  const cycleInfo = getCycleInfo(state.cycle);
  const maxGoalActions = Math.max(1, ...Object.values(state.goalActionCounts));
  return { total, doneCount, pct, alignmentPct, sortedTasks, focusQueue, cycleInfo, maxGoalActions };
}

/* ---------- mutations ---------- */
function toggleDone(id) {
  const task = state.tasks.find(t=>t.id===id);
  const wasDone = task?.done;
  state.tasks = state.tasks.map(t => t.id === id ? { ...t, done: !t.done, missed: false } : t);
  if (task && task.goalId != null) {
    const cur = state.goalActionCounts[task.goalId] || 0;
    state.goalActionCounts[task.goalId] = wasDone ? Math.max(0, cur - 1) : cur + 1;
  }
  state.points = Math.max(0, state.points + (wasDone ? -10 : 10));
  saveState(); render();
}
function markMissed(id) { state.tasks = state.tasks.map(t => t.id===id ? {...t, missed: !t.missed, done:false} : t); saveState(); render(); }
function delTask(id) { state.tasks = state.tasks.filter(t => t.id !== id); saveState(); render(); }
function updateTask(id, patch) { state.tasks = state.tasks.map(t => t.id === id ? { ...t, ...patch } : t); saveState(); }
function setTheme(val) { state.dailyThemes[state.date] = val; saveState(); }
function setCycle(patch) { Object.assign(state.cycle, patch); saveState(); renderMoon(); }
function addLifeGoal(goal) { state.lifeGoals.push(goal); saveState(); render(); }
function closeOut() {
  const { total, pct } = computed();
  if (total === 0) return;
  state.streak = pct >= 70 ? state.streak + 1 : 0;
  state.bestStreak = Math.max(state.bestStreak, state.streak);
  saveState(); render();
}
function focusDone(id) {
  const task = state.tasks.find(t=>t.id===id);
  if (task && task.goalId != null) state.goalActionCounts[task.goalId] = (state.goalActionCounts[task.goalId]||0) + 1;
  state.tasks = state.tasks.map(t => t.id===id?{...t,done:true,missed:false}:t);
  state.points += 10;
  reflectOpen = false;
  saveState(); render();
}
function focusSkip(id) {
  state.tasks = state.tasks.map(t => t.id===id?{...t,order:state.nextOrder}:t);
  state.nextOrder += 1;
  reflectOpen = false;
  saveState(); render();
}
function addQuickTask() {
  const timeEl = document.getElementById("qTime"), titleEl = document.getElementById("qTitle");
  const title = titleEl.value.trim();
  if (!title) return;
  const catEl = document.getElementById("qCat"), appEl = document.getElementById("qApp"),
        urlEl = document.getElementById("qUrl"), goalEl = document.getElementById("qGoal");
  const t = {
    id: Date.now(), title, time: timeEl.value || "--:--",
    categoryId: catEl ? catEl.value : "spiritual",
    resourceUrl: (urlEl && urlEl.value.trim()) || null,
    app: (appEl && appEl.value.trim()) || null,
    goalId: (goalEl && goalEl.value !== "") ? Number(goalEl.value) : null,
    note: "", deviation: "", deviationImpact: "none",
    done: false, missed: false, order: state.nextOrder,
  };
  state.tasks.push(t); state.nextOrder += 1;
  saveState();
  timeEl.value = ""; titleEl.value = "";
  if (appEl) appEl.value = ""; if (urlEl) urlEl.value = ""; if (goalEl) goalEl.value = "";
  render();
}
function addGoalFromForm() {
  const desc = document.getElementById("newGoalDesc").value.trim();
  if (!desc) return;
  const part = document.getElementById("newGoalPart").value.trim() || "—";
  const status = document.getElementById("newGoalStatus").value;
  const importance = Number(document.getElementById("newGoalImportance").value) || 8;
  addLifeGoal({ desc, part, status, importance });
}

/* ---------- location + ambient sky + prayer times ---------- */
function paintSkyNow() {
  const useCoords = coords || FALLBACK_COORDS;
  const sunTimes = getSunTimes(useCoords.lat, useCoords.lon, new Date());
  const c = getSkyColors(new Date(), sunTimes);
  const app = document.getElementById("app");
  if (app) app.style.background = `radial-gradient(ellipse at 25% -10%, ${c.center} 0%, ${c.edge} 60%)`;
}
function resolveLocation() {
  paintSkyNow();
  setInterval(paintSkyNow, 2*60*1000);
  if (coords) { afterCoords(); return; }
  if (navigator.geolocation) {
    navigator.geolocation.getCurrentPosition(
      pos => { coords = { lat: pos.coords.latitude, lon: pos.coords.longitude }; saveGeo(coords); afterCoords(); paintSkyNow(); },
      () => { coords = FALLBACK_COORDS; saveGeo(coords); afterCoords(); },
      { timeout: 6000 }
    );
  } else { coords = FALLBACK_COORDS; afterCoords(); }
}
function afterCoords() {
  applyPrayerTimes();
}
function applySky() { paintSkyNow(); }
function applyPrayerTimes() {
  if (!coords) return;
  const guard = todayStr() + "-hanafi";
  if (state.prayerTimesAppliedDate === guard) return;
  if (state.tasks.length === 0) return;
  const pt = getPrayerTimes(coords.lat, coords.lon, new Date());
  if (!pt) return;
  const nameMap = [["fajr",pt.fajr],["dhuhr",pt.dhuhr],["asr",pt.asr],["maghrib",pt.maghrib],["isha",pt.isha],["iftār",pt.maghrib],["iftar",pt.maghrib]];
  state.tasks = state.tasks.map(t => {
    const lower = t.title.toLowerCase();
    const match = nameMap.find(([name]) => lower.includes(name));
    return match ? { ...t, time: fmtTime(match[1]) } : t;
  });
  state.prayerTimesAppliedDate = guard;
  saveState(); render();
}

const STALE_HOURS = 2;
function clearStaleTasks() {
  const now = new Date();
  let changed = false;
  state.tasks = state.tasks.map(t => {
    if (t.done || t.missed || !t.time || t.time === "--:--") return t;
    const [h,m] = t.time.split(":").map(Number);
    const taskTime = new Date(); taskTime.setHours(h, m, 0, 0);
    if ((now - taskTime) / 3600000 > STALE_HOURS) { changed = true; return { ...t, missed: true }; }
    return t;
  });
  if (changed) { saveState(); render(); }
}

/* ---------- timer ---------- */
function toggleTimer() {
  running = !running;
  if (running) {
    timerInterval = setInterval(() => {
      timeLeft -= 1;
      if (timeLeft <= 0) { tMode = tMode === "focus" ? "break" : "focus"; timeLeft = tMode === "focus" ? FOCUS_LEN : BREAK_LEN; }
      renderTimerDisplay();
    }, 1000);
  } else { clearInterval(timerInterval); }
  render();
}
function resetTimer() { running = false; clearInterval(timerInterval); tMode = "focus"; timeLeft = FOCUS_LEN; render(); }
function renderTimerDisplay() {
  const mm = String(Math.floor(timeLeft/60)).padStart(2,"0"), ss = String(timeLeft%60).padStart(2,"0");
  const el = document.getElementById("timerDigits"); if (el) el.textContent = mm+":"+ss;
  const modeEl = document.getElementById("timerModeLabel"); if (modeEl) modeEl.textContent = tMode==="focus"?"Focus":"Break";
}

/* ---------- render ---------- */
function renderMoon() {
  const c = computed();
  const ring = document.getElementById("moonShadow");
  const pct = c.cycleInfo ? c.cycleInfo.pct : 50;
  if (ring) ring.style.transform = `translateX(${pct}%)`;
  const stats = document.getElementById("headerStats");
  if (stats) stats.textContent = (c.cycleInfo ? `${c.cycleInfo.phase} · day ${c.cycleInfo.cycleDay}` : "cycle not set") + ` · ${c.doneCount}/${c.total} today · ${state.streak}-night streak`;
}

    <div>
      <span class="toggle-line" onclick="showAdvancedAdd=!showAdvancedAdd; renderPlan();">${showAdvancedAdd?"hide":"+ category / app / goal"}</span>
      <span class="toggle-line" onclick="showTimer=!showTimer; renderPlan();">${showTimer?"hide timer":"+ focus timer"}</span>
      <span class="toggle-line" onclick="closeOut()">close out day</span>
    </div>
    ${showTimer ? `
    <div class="expand-panel">
      <div class="timer-mode" id="timerModeLabel">${tMode==="focus"?"Focus":"Break"}</div>
      <div class="timer-display mono" id="timerDigits">${String(Math.floor(timeLeft/60)).padStart(2,"0")}:${String(timeLeft%60).padStart(2,"0")}</div>
      <div class="timer-controls">
        <button class="primary" onclick="toggleTimer()">${running?"Pause":"Start"}</button>
        <button class="ghost" onclick="resetTimer()">Reset</button>
      </div>
    </div>` : ""}
    <div class="header-stats" style="margin-top:16px">${alignmentPct}% of today's completed actions are linked to a life goal · ${state.points} pts</div>
  `;
}

function renderGoalsInner() {
  const { maxGoalActions } = computed();
  const idxs = state.lifeGoals.map((g,i)=>i)
    .filter(i => goalFilter==="all" || state.lifeGoals[i].status===goalFilter)
    .sort((a,b)=>state.lifeGoals[b].importance - state.lifeGoals[a].importance);
  const rows = idxs.map(idx => {
    const g = state.lifeGoals[idx], count = state.goalActionCounts[idx] || 0;
    return `<div class="goal-row">
      <span class="goal-desc">${esc(g.desc)}<span class="goal-sub">${esc(g.part)}</span></span>
      <div class="goal-bar-track"><div class="goal-bar-fill" style="width:${Math.round((count/maxGoalActions)*100)}%"></div></div>
      <span class="goal-importance mono">${g.importance}</span>
    </div>`;
  }).join("");
  return `
    <div class="goals-filter">
      ${["all","progress","notyet"].map(f=>`<span class="nav-tab" style="color:${goalFilter===f?"var(--text)":"var(--text-dim)"};cursor:pointer" onclick="goalFilter='${f}'; renderGoals();">${f==="all"?"All":f==="progress"?"In progress":"Not yet"}</span>`).join("")}
    </div>
    ${rows}
    <div class="expand-panel" style="margin-top:16px">
      <span class="detail-label">Add a new life goal</span>
      <input type="text" id="newGoalDesc" placeholder="e.g. Learn to sail" />
      <div class="detail-row">
        <input type="text" id="newGoalPart" placeholder="Area · timeframe (optional)" />
        <select id="newGoalStatus" style="max-width:110px">
          <option value="notyet">Not yet</option>
          <option value="progress">In progress</option>
        </select>
        <input type="number" id="newGoalImportance" min="1" max="10" value="8" style="max-width:70px" title="Importance 1–10" />
      </div>
      <button class="primary" style="align-self:flex-start" onclick="addGoalFromForm()">Add goal</button>
    </div>
  `;
}

function render() {
  const app = document.getElementById("app");
  const c = computed();
  app.innerHTML = `
    <div class="sky-deco"></div>
    <div class="sky-cloud" style="top:-20px;left:10%;width:180px;height:90px"></div>
    <div class="sky-cloud" style="top:0px;left:60%;width:220px;height:100px;animation-delay:6s"></div>

    <div class="header">
      <div class="moon-ring" onclick="showCycle=!showCycle; render();" title="Tap to set your cycle">
        <div class="moon-body"></div>
        <div class="moon-shadow" id="moonShadow" style="transform:translateX(${c.cycleInfo?c.cycleInfo.pct:50}%)"></div>
      </div>
      <div class="header-text">
        <h1 class="fraunces">Momentum</h1>
        <div class="header-sub">${new Date().toLocaleDateString(undefined,{weekday:'long', month:'short', day:'numeric'})}</div>
        <div class="header-stats" id="headerStats">${c.cycleInfo?`${c.cycleInfo.phase} · day ${c.cycleInfo.cycleDay}`:"cycle not set"} · ${c.doneCount}/${c.total} today · ${state.streak}-night streak</div>
      </div>
    </div>

    <input class="theme-line" type="text" placeholder="Name today…" value="${esc(state.dailyThemes[state.date]||"")}" onchange="setTheme(this.value)" />

    ${showCycle ? `
    <div class="expand-panel">
      <div class="detail-row">
        <div><span class="detail-label">Last period start</span><input type="date" value="${esc(state.cycle.lastStart)}" onchange="setCycle({lastStart:this.value})" /></div>
        <div><span class="detail-label">Cycle length</span><input type="number" value="${state.cycle.cycleLength}" onchange="setCycle({cycleLength:Number(this.value)})" /></div>
        <div><span class="detail-label">Period length</span><input type="number" value="${state.cycle.periodLength}" onchange="setCycle({periodLength:Number(this.value)})" /></div>
      </div>
    </div>` : ""}

    <div class="nav-tabs">
      <button class="nav-tab ${view==='focus'?'active':''}" onclick="view='focus'; render();">Focus</button>
      <button class="nav-tab ${view==='plan'?'active':''}" onclick="view='plan'; render();">Plan</button>
      <button class="nav-tab ${view==='goals'?'active':''}" onclick="view='goals'; render();">Life Goals</button>
    </div>

    <div id="viewRoot">
      ${view==='focus' ? renderFocus() : view==='plan' ? renderPlanInner() : renderGoalsInner()}
    </div>

    <div class="offline-note">Runs fully offline · location used only for prayer times and the sky</div>
  `;
}
function renderPlan() { document.getElementById("viewRoot").innerHTML = renderPlanInner(); }
function renderGoals() { document.getElementById("viewRoot").innerHTML = renderGoalsInner(); }

/* expose functions used by inline handlers */
window.toggleDone = toggleDone; window.markMissed = markMissed; window.delTask = delTask;
window.updateTask = updateTask; window.setTheme = setTheme; window.setCycle = setCycle;
window.addLifeGoal = addLifeGoal; window.closeOut = closeOut; window.focusDone = focusDone;
window.focusSkip = focusSkip; window.addQuickTask = addQuickTask; window.addGoalFromForm = addGoalFromForm;
window.toggleTimer = toggleTimer; window.resetTimer = resetTimer; window.render = render;
window.renderPlan = renderPlan; window.renderGoals = renderGoals;
Object.defineProperty(window, "view", { get:()=>view, set:v=>view=v });
Object.defineProperty(window, "expandedId", { get:()=>expandedId, set:v=>expandedId=v });
Object.defineProperty(window, "showCycle", { get:()=>showCycle, set:v=>showCycle=v });
Object.defineProperty(window, "showTimer", { get:()=>showTimer, set:v=>showTimer=v });
Object.defineProperty(window, "showAdvancedAdd", { get:()=>showAdvancedAdd, set:v=>showAdvancedAdd=v });
Object.defineProperty(window, "goalFilter", { get:()=>goalFilter, set:v=>goalFilter=v });
Object.defineProperty(window, "reflectOpen", { get:()=>reflectOpen, set:v=>reflectOpen=v });

render();
resolveLocation();
clearStaleTasks();
setInterval(clearStaleTasks, 5*60*1000);
})();
</script>
</body>
</html>
