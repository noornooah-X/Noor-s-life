<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Noor's Life</title>
<link rel="manifest" href="manifest.json">

<style>
  :root {
    --bg: #17162a;
    --bg-2: #1f1d38;
    --surface: #232141;
    --moon: #f5e6c8;
    --moon-soft: #d9c9a0;
    --ash: #423f60;
    --ash-light: #605c82;
    --blush: #d9a3b8;
    --sage: #a8d8c9;
    --lavender: #b8aedb;
    --text: #f0ece4;
    --text-dim: #8f8aa8;
    --font-display: Georgia, 'Iowan Old Style', 'Palatino Linotype', 'Book Antiqua', serif;
    --font-body: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
    --font-mono: ui-monospace, 'SF Mono', 'Cascadia Code', 'Roboto Mono', Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: #0c0b16; }
  body { font-family: var(--font-body); color: var(--text); display: flex; justify-content: center; padding: 16px; }

  #app {
    background: radial-gradient(ellipse at 25% -10%, #2b2750 0%, var(--bg) 60%);
    color: var(--text);
    border-radius: 20px;
    padding: 26px 22px 30px;
    max-width: 640px;
    width: 100%;
    box-sizing: border-box;
    position: relative;
    overflow: hidden;
    min-height: 560px;
    transition: background 4s ease;
  }
  .sky-deco {
    position: absolute; inset: 0; pointer-events: none; z-index: 0;
    background-image:
      radial-gradient(1.5px 1.5px at 12% 15%, var(--moon-soft), transparent),
      radial-gradient(1.5px 1.5px at 82% 10%, var(--moon-soft), transparent),
      radial-gradient(1px 1px at 60% 25%, var(--moon-soft), transparent),
      radial-gradient(1.5px 1.5px at 30% 40%, var(--moon-soft), transparent),
      radial-gradient(1px 1px at 92% 45%, var(--moon-soft), transparent),
      radial-gradient(1px 1px at 45% 8%, var(--moon-soft), transparent);
    opacity: 0.45;
    animation: twinkle 8s ease-in-out infinite;
  }
  @keyframes twinkle { 0%,100% { opacity: 0.3; } 50% { opacity: 0.55; } }
  .sky-cloud {
    position: absolute; border-radius: 50%; filter: blur(6px); pointer-events: none; z-index: 0;
    background: radial-gradient(ellipse, rgba(184,174,219,0.12), rgba(184,174,219,0) 70%);
    animation: driftslow 90s ease-in-out infinite;
  }
  @keyframes driftslow { 0%,100% { transform: translateX(0); } 50% { transform: translateX(24px); } }
  #app > *:not(.sky-deco):not(.sky-cloud) { position: relative; z-index: 1; }

  .fraunces { font-family: var(--font-display); font-style: italic; }
  .mono { font-family: var(--font-mono); }
  a { color: inherit; }

  .header { display: flex; align-items: center; gap: 18px; margin-bottom: 6px; }
  .moon-col { display: flex; flex-direction: column; align-items: center; gap: 4px; flex-shrink: 0; }
  .moon-ring { position: relative; width: 74px; height: 74px; border-radius: 50%; overflow: hidden; flex-shrink: 0; cursor: pointer; }
  .moon-caption { font-size: 9px; color: var(--text-dim); text-align: center; max-width: 80px; line-height: 1.2; }
  .moon-body { position: absolute; inset: 0; border-radius: 50%; background: linear-gradient(135deg, var(--moon), var(--moon-soft)); }
  .moon-shadow { position: absolute; inset: 0; border-radius: 50%; background: var(--bg-2); transition: transform 0.7s ease; box-shadow: inset -8px 0 14px rgba(0,0,0,0.25); }
  .header-text h1 { font-size: 22px; margin: 0 0 2px; font-weight: 600; }
  .header-sub { font-size: 12px; color: var(--text-dim); }
  .day-type-badge {
    display: inline-block; font-size: 10px; letter-spacing: 0.06em; text-transform: uppercase;
    color: var(--sage); background: rgba(168,216,201,0.14); padding: 3px 9px; border-radius: 10px;
    margin-bottom: 5px;
  }
  .phase-badge {
    display: inline-block; font-size: 10px; letter-spacing: 0.06em; text-transform: uppercase;
    color: var(--lavender); background: rgba(184,174,219,0.16); padding: 3px 9px; border-radius: 10px;
    margin: 0 0 5px 6px;
  }
  .header-stats { font-size: 11.5px; color: var(--text-dim); margin-top: 3px; }

  .theme-line {
    width: 100%; background: none; border: none; border-bottom: 1px solid var(--ash);
    padding: 6px 2px; color: var(--text); font-family: var(--font-display); font-style: italic;
    font-size: 15px; margin: 16px 0 20px;
  }
  .theme-line::placeholder { color: var(--text-dim); }
  .theme-line:focus { outline: none; border-bottom-color: var(--moon-soft); }

  .nav-tabs { display: flex; gap: 6px; margin-bottom: 18px; }
  .nav-tab {
    background: none; border: none; color: var(--text-dim); font-size: 12.5px; font-weight: 600;
    cursor: pointer; font-family: inherit; padding: 4px 0; margin-right: 16px; border-bottom: 2px solid transparent;
  }
  .nav-tab.active { color: var(--text); border-bottom-color: var(--moon-soft); }

  .task-list { margin-bottom: 6px; }
  .task-row {
    display: flex; align-items: center; gap: 10px; padding: 10px 4px;
    border-bottom: 1px solid rgba(255,255,255,0.05); cursor: pointer;
  }
  .task-row:last-child { border-bottom: none; }
  .cat-dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }
  .task-check {
    width: 19px; height: 19px; border-radius: 50%; border: 2px solid var(--ash-light);
    flex-shrink: 0; display: flex; align-items: center; justify-content: center;
    font-size: 10px; background: transparent;
  }
  .task-check.done { background: var(--moon); border-color: var(--moon); color: var(--bg); }
  .task-check.missed { background: transparent; border-color: var(--blush); color: var(--blush); }
  .task-time { font-family: var(--font-mono); font-size: 10.5px; color: var(--text-dim); width: 38px; flex-shrink: 0; }
  .task-title { flex: 1; font-size: 13.5px; }
  .task-title.done { color: var(--text-dim); text-decoration: line-through; }
  .task-title.missed { color: var(--blush); }
  .task-caret { color: var(--text-dim); font-size: 11px; flex-shrink: 0; }

  .task-detail {
    padding: 10px 4px 16px 33px; display: flex; flex-direction: column; gap: 10px;
    border-bottom: 1px solid rgba(255,255,255,0.05);
  }
  .detail-label { font-size: 10px; letter-spacing: 0.05em; text-transform: uppercase; color: var(--text-dim); display: block; margin-bottom: 3px; }
  .detail-row { display: flex; gap: 8px; flex-wrap: wrap; }
  .detail-row > div { flex: 1; min-width: 120px; }
  .detail-actions { display: flex; gap: 14px; margin-top: 2px; }
  .detail-actions button {
    background: none; border: none; color: var(--text-dim); font-size: 11.5px; cursor: pointer; font-family: inherit;
    text-decoration: underline; padding: 0;
  }
  .detail-actions button:hover { color: var(--text); }

  input[type=text], input[type=time], input[type=url], input[type=date], input[type=number],
  select, textarea {
    background: var(--bg-2); border: 1px solid var(--ash); border-radius: 10px;
    padding: 7px 10px; color: var(--text); font-family: inherit; font-size: 12.5px; width: 100%;
  }
  textarea { resize: vertical; }

  .quick-add { display: flex; gap: 8px; margin: 14px 0 4px; }
  .quick-add input[type=time] { width: 84px; flex-shrink: 0; }
  .quick-add input[type=text] { flex: 1; }
  button.primary {
    background: var(--moon); color: #241d08; border: none; border-radius: 10px;
    padding: 7px 14px; font-weight: 600; font-size: 12.5px; cursor: pointer; font-family: inherit; flex-shrink: 0;
  }
  button.ghost {
    background: none; border: 1px solid var(--ash); color: var(--text-dim);
    border-radius: 10px; padding: 6px 12px; font-size: 11.5px; cursor: pointer; font-family: inherit;
  }
  button.ghost:hover { color: var(--text); border-color: var(--ash-light); }

  .toggle-line {
    font-size: 11.5px; color: var(--text-dim); cursor: pointer; text-decoration: underline;
    display: inline-block; margin: 10px 12px 0 0;
  }
  .toggle-line:hover { color: var(--text); }

  .expand-panel {
    background: var(--surface); border-radius: 14px; padding: 14px; margin-top: 10px;
    display: flex; flex-direction: column; gap: 10px;
  }

  .timer-display { font-family: var(--font-mono); font-size: 34px; text-align: center; color: var(--sage); }
  .timer-mode { text-align: center; font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--text-dim); }
  .timer-controls { display: flex; justify-content: center; gap: 8px; margin-top: 6px; }

  .empty { color: var(--text-dim); font-size: 13px; padding: 20px 4px; text-align: center; }

  .focus-home { min-height: 380px; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 20px 10px 70px; }
  .focus-home-eyebrow { font-size: 11.5px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--text-dim); margin-bottom: 14px; }
  .focus-home-title { font-size: 30px; font-weight: 600; line-height: 1.3; margin-bottom: 16px; max-width: 420px; }
  .focus-home-time { font-family: var(--font-mono); color: var(--moon); font-size: 13px; margin-bottom: 16px; }
  .focus-home-app {
    display: inline-flex; font-size: 12.5px; color: var(--sage); background: rgba(168,216,201,0.12);
    padding: 5px 14px; border-radius: 20px; margin-bottom: 18px; text-decoration: none; cursor: pointer;
  }
  .focus-home-app:hover { background: rgba(168,216,201,0.22); }
  .focus-home-goalpct {
    display: inline-flex; font-size: 12px; color: var(--lavender); background: rgba(184,174,219,0.13);
    padding: 5px 14px; border-radius: 20px; margin-bottom: 18px;
  }
  .task-goalpct {
    font-size: 9.5px; color: var(--lavender); background: rgba(184,174,219,0.14);
    padding: 2px 7px; border-radius: 8px; flex-shrink: 0; white-space: nowrap;
  }
  .focus-home-media { max-width: 100%; max-height: 240px; border-radius: 14px; margin-bottom: 20px; }
  .focus-home-link { display: inline-block; margin-bottom: 20px; color: var(--sage); font-size: 12.5px; text-decoration: underline; }
  .focus-home-actions { display: flex; gap: 10px; justify-content: center; margin-bottom: 6px; }
  .focus-home-done {
    background: var(--moon); color: #241d08; border: none; border-radius: 12px;
    padding: 13px 30px; font-weight: 600; font-size: 14.5px; cursor: pointer; font-family: inherit;
  }
  .focus-home-skip {
    background: none; border: 1px solid var(--ash); color: var(--text-dim);
    border-radius: 12px; padding: 13px 22px; font-size: 13.5px; cursor: pointer; font-family: inherit;
  }
  .cat-wrap { position: relative; display: flex; justify-content: center; margin: 16px 0 2px; }
  .cat-face {
    background: rgba(245,230,200,0.12); border: 1px solid var(--ash); border-radius: 50%;
    width: 46px; height: 46px; font-size: 22px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: transform 0.15s, background 0.15s; font-family: inherit;
  }
  .cat-face:hover { background: rgba(245,230,200,0.2); transform: scale(1.08); }
  .cat-face:active { transform: scale(0.92); }
  .meow-bubble {
    position: absolute; top: -26px; left: 50%; transform: translate(-50%, 4px);
    background: var(--surface); color: var(--moon); font-size: 11px; padding: 4px 12px;
    border-radius: 12px; opacity: 0; transition: opacity 0.2s ease, transform 0.2s ease;
    pointer-events: none; white-space: nowrap;
  }
  .meow-bubble.show { opacity: 1; transform: translate(-50%, 0); }
  .achievement-toast {
    position: absolute; top: 16px; left: 50%; transform: translate(-50%, -12px);
    background: var(--moon); color: #241d08; font-size: 13px; font-weight: 600;
    padding: 10px 20px; border-radius: 16px; opacity: 0; pointer-events: none;
    transition: opacity 0.25s ease, transform 0.25s ease; z-index: 10; white-space: nowrap;
    box-shadow: 0 4px 18px rgba(0,0,0,0.3);
  }
  .achievement-toast.show { opacity: 1; transform: translate(-50%, 0); }
  .focus-home-reflect-toggle {
    background: none; border: none; color: var(--text-dim); font-size: 11.5px; text-decoration: underline;
    cursor: pointer; font-family: inherit; margin-top: 14px;
  }
  .focus-home-reflect-panel {
    text-align: left; background: rgba(255,255,255,0.05); border-radius: 12px; padding: 14px;
    margin-top: 12px; display: flex; flex-direction: column; gap: 10px; max-width: 380px; width: 100%;
  }
  .focus-home-empty { font-size: 40px; margin-bottom: 10px; }

  .next-preview {
    position: absolute; bottom: 20px; right: 20px; z-index: 2;
    background: rgba(35,33,65,0.75); backdrop-filter: blur(6px);
    border: 1px solid var(--ash); border-radius: 14px; padding: 10px 14px;
    max-width: 190px; text-align: right;
  }
  .next-preview-label { font-size: 9px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--text-dim); margin-bottom: 3px; }
  .next-preview-title { font-size: 12px; color: var(--text); line-height: 1.35; }
  .next-preview-time { font-family: var(--font-mono); font-size: 10px; color: var(--moon-soft); margin-top: 3px; }
  @media (max-width: 480px) { .next-preview { right: 12px; bottom: 12px; max-width: 140px; padding: 8px 10px; } }

  .goal-row { display: flex; align-items: center; gap: 10px; padding: 10px 2px; border-bottom: 1px solid rgba(255,255,255,0.05); }
  .goal-row:last-child { border-bottom: none; }
  .goal-desc { flex: 1; font-size: 13.5px; }
  .goal-desc .goal-sub { display: block; font-size: 10.5px; color: var(--text-dim); margin-top: 2px; }
  .goal-bar-track { width: 60px; height: 5px; background: var(--surface); border-radius: 4px; overflow: hidden; flex-shrink: 0; }
  .goal-bar-fill { background: var(--moon-soft); height: 100%; }
  .goal-importance { font-family: var(--font-mono); font-size: 11px; color: var(--text-dim); width: 22px; text-align: right; flex-shrink: 0; }
  .goals-filter { display: flex; gap: 14px; margin-bottom: 14px; }
  .yearly-header { text-align: center; margin-bottom: 12px; }
  .yearly-count { font-size: 32px; font-weight: 600; }
  .yearly-sub { font-size: 11px; color: var(--text-dim); letter-spacing: 0.04em; text-transform: uppercase; }
  .pace-track { position: relative; height: 10px; background: var(--surface); border-radius: 6px; overflow: visible; margin-bottom: 6px; }
  .pace-fill { position: absolute; inset: 0; width: 0; background: var(--moon-soft); border-radius: 6px; transition: width 0.4s ease; }
  .pace-marker { position: absolute; top: -3px; bottom: -3px; width: 2px; background: var(--blush); }
  .pace-label { font-size: 11px; color: var(--text-dim); text-align: center; margin-bottom: 16px; }
  .yearly-list { margin-bottom: 4px; }
  .offline-note { font-size: 10.5px; color: var(--text-dim); text-align: center; margin-top: 18px; opacity: 0.7; }
</style>

<script>
(function() {
"use strict";

/* ---------- storage (localStorage — works fully offline) ---------- */
const STORAGE_KEY = "momentum-offline-v1";

function median(arr) {
  if (arr.length === 0) return null;
  const s = [...arr].sort((a,b) => a-b);
  const mid = Math.floor(s.length/2);
  return s.length % 2 ? s[mid] : (s[mid-1]+s[mid])/2;
}

function computeCycleStats(history) {
  if (!history || history.length === 0) return null;
  const sorted = [...history].sort((a,b) => new Date(a.start) - new Date(b.start));
  const periodLens = sorted.filter(e => e.end).map(e => Math.round((new Date(e.end) - new Date(e.start))/86400000) + 1);
  const cycleLens = [];
  for (let i = 0; i < sorted.length - 1; i++) {
    const gap = Math.round((new Date(sorted[i+1].start) - new Date(sorted[i].start)) / 86400000);
    if (gap >= 15 && gap <= 60) cycleLens.push(gap); // exclude non-representative gaps (e.g. pregnancy-related)
  }
  const avgCycleLength = cycleLens.length ? Math.round(median(cycleLens)) : 28;
  const avgPeriodLength = periodLens.length ? Math.round(median(periodLens)) : 5;
  const lastEntry = sorted[sorted.length - 1];
  return { avgCycleLength, avgPeriodLength, lastStart: lastEntry.start, cyclesUsed: cycleLens.length, openEntry: !lastEntry.end };
}

function getMoonPhase(date) {
  const synodic = 29.530588853;
  const knownNewMoon = Date.UTC(2000, 0, 6, 18, 14, 0);
  const diffDays = (date.getTime() - knownNewMoon) / 86400000;
  let age = diffDays % synodic;
  if (age < 0) age += synodic;
  const illumination = (1 - Math.cos((2 * Math.PI * age) / synodic)) / 2;
  let name;
  if (age < 1.84566) name = "New Moon";
  else if (age < 5.53699) name = "Waxing Crescent";
  else if (age < 9.22831) name = "First Quarter";
  else if (age < 12.91963) name = "Waxing Gibbous";
  else if (age < 16.61096) name = "Full Moon";
  else if (age < 20.30228) name = "Waning Gibbous";
  else if (age < 23.99361) name = "Last Quarter";
  else if (age < 27.68493) name = "Waning Crescent";
  else name = "New Moon";
  return { age, illumination, pct: Math.round(illumination * 100), name };
}

function getCycleInfo(periodHistory, fallbackCycle) {
  const stats = computeCycleStats(periodHistory);
  let lastStart, cycleLen, periodLen;
  if (stats) {
    lastStart = stats.lastStart; cycleLen = stats.avgCycleLength; periodLen = stats.avgPeriodLength;
  } else if (fallbackCycle && fallbackCycle.lastStart) {
    lastStart = fallbackCycle.lastStart; cycleLen = fallbackCycle.cycleLength || 28; periodLen = fallbackCycle.periodLength || 5;
  } else {
    return null;
  }
  const last = new Date(lastStart + "T00:00:00");
  const today = new Date(todayStr() + "T00:00:00");
  const diffDays = Math.round((today - last) / 86400000);
  const cycleDay = (((diffDays % cycleLen) + cycleLen) % cycleLen) + 1;
  const ovulationDay = Math.max(periodLen + 2, cycleLen - 14);
  let phase, pct;
  if (cycleDay <= periodLen) { phase = "Menstrual"; pct = 0; }
  else if (cycleDay < ovulationDay) { phase = "Follicular"; pct = Math.round(((cycleDay - periodLen) / (ovulationDay - periodLen)) * 55); }
  else if (cycleDay <= ovulationDay + 1) { phase = "Ovulation"; pct = 100; }
  else {
    phase = "Luteal";
    const lutealLen = Math.max(1, cycleLen - (ovulationDay + 1));
    const prog = cycleDay - (ovulationDay + 1);
    pct = Math.round(100 - (prog / lutealLen) * 100);
  }
  return { cycleDay, phase, pct: Math.max(0, Math.min(100, pct)), avgCycleLength: cycleLen, avgPeriodLength: periodLen, cyclesUsed: stats ? stats.cyclesUsed : 0 };
}

function formatDayMarkdown(dateStr, theme, tasks) {
  const lines = [
    "---", `date: ${dateStr}`, "---", "",
    `# ${dateStr}`, "", `**Theme:** ${theme || "—"}`, "", "## Tasks",
  ];
  tasks.forEach(t => {
    const box = t.done ? "[x]" : "[ ]";
    const status = t.missed ? " *(missed)*" : "";
    lines.push(`- ${box} ${t.time !== "--:--" ? t.time + " " : ""}${t.title}${status}`);
    if (t.note) lines.push(`    - Note: ${t.note}`);
    if (t.deviation) lines.push(`    - Deviation (${t.deviationImpact}): ${t.deviation}`);
  });
  return lines.join("\n");
}
function exportToObsidian(dateStr, tasks) {
  if (!state.obsidianVault) return false;
  const content = formatDayMarkdown(dateStr, state.dailyThemes[dateStr], tasks);
  const url = `obsidian://new?vault=${encodeURIComponent(state.obsidianVault)}&name=${encodeURIComponent(dateStr)}&content=${encodeURIComponent(content)}&overwrite=true&silent=true`;
  window.location.href = url;
  return true;
}

  const themeInstruction = theme
    ? `\n\nAlso: the theme/intention I set for today was "${theme}". Rate out of 5 how well my day's actions actually lived up to that theme, and explain your reasoning with specific reference to what I did or didn't do.`
    : `\n\nAlso: I didn't set a theme for today \u2014 note that plainly rather than inventing one.`;
  return `${ANALYZER_PROMPT}${themeInstruction}\n\n---\n\nHere are today's logs:\n\n${log}`;
}

/* Any scheduled task more than 2 hours overdue and never done gets quietly marked missed,
   so the Focus queue always shows something actually current instead of stalling on old items. */
const STALE_HOURS = 2;
function clearStaleTasks() {
  const now = new Date();
  let changed = false;
  state.tasks = state.tasks.map(t => {
    if (t.done || t.missed || !t.time || t.time === "--:--") return t;
    const [h,m] = t.time.split(":").map(Number);
    const taskTime = new Date(); taskTime.setHours(h, m, 0, 0);
    if ((now - taskTime) / 3600000 > STALE_HOURS) { changed = true; return { ...t, missed: true }; }
    return t;
  });
  if (changed) { saveState(); render(); }
}

/* ---------- timer ---------- */
function playChirp() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const now = ctx.currentTime;
    const jitter = 0.92 + Math.random() * 0.16; // slight per-tap variety so it's not robotic

    const master = ctx.createGain();
    master.gain.setValueAtTime(0.0001, now);
    master.gain.exponentialRampToValueAtTime(0.28, now + 0.04);
    master.gain.exponentialRampToValueAtTime(0.0001, now + 0.5);
    master.connect(ctx.destination);

    const filter = ctx.createBiquadFilter();
    filter.type = "lowpass";
    filter.frequency.setValueAtTime(2000, now);
    filter.frequency.exponentialRampToValueAtTime(700, now + 0.5); // "mouth closing" on the ow
    filter.connect(master);

    const osc = ctx.createOscillator();
    osc.type = "sawtooth"; // richer harmonics than a plain sine, more voice-like
    osc.frequency.setValueAtTime(520 * jitter, now);
    osc.frequency.exponentialRampToValueAtTime(860 * jitter, now + 0.09); // "me"
    osc.frequency.exponentialRampToValueAtTime(300 * jitter, now + 0.48); // "ow"
    osc.connect(filter);

    const vibrato = ctx.createOscillator();
    vibrato.frequency.value = 14;
    const vibratoGain = ctx.createGain();
    vibratoGain.gain.value = 16;
    vibrato.connect(vibratoGain);
    vibratoGain.connect(osc.frequency);

    osc.start(now); osc.stop(now + 0.52);
    vibrato.start(now); vibrato.stop(now + 0.52);
  } catch (e) {}
}

        const expanded = expandedId === t.id;
        return `
        <div class="task-row" onclick="expandedId=${expandedId===t.id?"null":t.id}; renderPlan();">
          <div class="task-check ${t.done?"done":t.missed?"missed":""}" onclick="event.stopPropagation(); toggleDone(${t.id});">${t.done?"✓":t.missed?"✕":""}</div>
          <span class="cat-dot" style="background:${CAT_COLORS[t.categoryId]||"#888"}"></span>
          <span class="task-time mono">${esc(t.time)}</span>
          <span class="task-title ${t.done?"done":t.missed?"missed":""}">${esc(t.title)}</span>
          ${t.goalId != null ? `<span class="task-goalpct" title="Equal share among today's goal-linked tasks">🎯 ${goalPct}%</span>` : ""}
          <span class="task-caret">${expanded?"▴":"▾"}</span>
        </div>
        ${expanded ? taskDetailHtml(t) : ""}`;
      }).join("");

  const catOptions = CATEGORIES.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join("");
  const goalOptions = `<option value="">— not linked —</option>` + state.lifeGoals.map((g,i)=>`<option value="${i}">${esc(g.desc)}</option>`).join("");

  return `
    <div class="task-list">${rows}</div>
    <div class="quick-add">
      <input type="time" id="qTime" />
      <input type="text" id="qTitle" placeholder="One small next action…" onkeydown="if(event.key==='Enter'){addQuickTask();}" />
      <button class="primary" onclick="addQuickTask()">Add</button>
    </div>
    ${showAdvancedAdd ? `
    <div class="expand-panel">
      <div class="detail-row">
        <div><span class="detail-label">Category</span><select id="qCat">${catOptions}</select></div>
        <div><span class="detail-label">App</span><input type="text" id="qApp" placeholder="Optional" /></div>
      </div>
      <div><span class="detail-label">Resource link / GIF</span><input type="url" id="qUrl" placeholder="Optional" /></div>
      <div><span class="detail-label">Life goal</span><select id="qGoal">${goalOptions}</select></div>
    </div>` : `<select id="qCat" style="display:none">${catOptions}</select><input id="qApp" style="display:none"><input id="qUrl" style="display:none"><select id="qGoal" style="display:none">${goalOptions}</select>`}
    <div>
      <span class="toggle-line" onclick="showAdvancedAdd=!showAdvancedAdd; renderPlan();">${showAdvancedAdd?"hide":"+ category / app / goal"}</span>
      <span class="toggle-line" onclick="showTimer=!showTimer; renderPlan();">${showTimer?"hide timer":"+ focus timer"}</span>
      <span class="toggle-line" onclick="showObsidian=!showObsidian; renderPlan();">${showObsidian?"hide":"+ Obsidian vault"}</span>
      <span class="toggle-line" onclick="closeOut()">close out day${state.obsidianVault?" (also sends to Obsidian)":""}</span>
      <span class="toggle-line" onclick="analyzeWithClaude()">analyze today with Claude</span>
    </div>
    ${showObsidian ? `
    <div class="expand-panel">
      <span class="detail-label">Obsidian vault name (exact name as it appears in Obsidian)</span>
      <input type="text" value="${esc(state.obsidianVault)}" onchange="setObsidianVault(this.value)" placeholder="e.g. My Vault" />
      <span class="detail-label" style="margin-top:4px">Once set, tapping "close out day" also creates/updates today's note in Obsidian — requires Obsidian installed on this device.</span>
    </div>` : ""}
    ${showTimer ? `
    <div class="expand-panel">
      <div class="timer-mode" id="timerModeLabel">${tMode==="focus"?"Focus":"Break"}</div>
      <div class="timer-display mono" id="timerDigits">${String(Math.floor(timeLeft/60)).padStart(2,"0")}:${String(timeLeft%60).padStart(2,"0")}</div>
      <div class="timer-controls">
        <button class="primary" onclick="toggleTimer()">${running?"Pause":"Start"}</button>
        <button class="ghost" onclick="resetTimer()">Reset</button>
      </div>
    </div>` : ""}
    <div class="header-stats" style="margin-top:16px">${alignmentPct}% of today's completed actions are linked to a life goal · ${state.points} pts</div>
  `;
}

function renderGoalsInner() {
  const { maxGoalActions } = computed();
  const idxs = state.lifeGoals.map((g,i)=>i)
    .filter(i => goalFilter==="all" || state.lifeGoals[i].status===goalFilter)
    .sort((a,b)=>state.lifeGoals[b].importance - state.lifeGoals[a].importance);
  const rows = idxs.map(idx => {
    const g = state.lifeGoals[idx], count = state.goalActionCounts[idx] || 0;
    return `<div class="goal-row">
      <span class="goal-desc">${esc(g.desc)}<span class="goal-sub">${esc(g.part)}</span></span>
      <div class="goal-bar-track"><div class="goal-bar-fill" style="width:${Math.round((count/maxGoalActions)*100)}%"></div></div>
      <span class="goal-importance mono">${g.importance}</span>
    </div>`;
  }).join("");
  return `
    <div class="goals-filter">
      ${["all","progress","notyet"].map(f=>`<span class="nav-tab" style="color:${goalFilter===f?"var(--text)":"var(--text-dim)"};cursor:pointer" onclick="goalFilter='${f}'; renderGoals();">${f==="all"?"All":f==="progress"?"In progress":"Not yet"}</span>`).join("")}
    </div>
    ${rows}
    <div class="expand-panel" style="margin-top:16px">
      <span class="detail-label">Add a new life goal</span>
      <input type="text" id="newGoalDesc" placeholder="e.g. Learn to sail" />
      <div class="detail-row">
        <input type="text" id="newGoalPart" placeholder="Area · timeframe (optional)" />
        <select id="newGoalStatus" style="max-width:110px">
          <option value="notyet">Not yet</option>
          <option value="progress">In progress</option>
        </select>
        <input type="number" id="newGoalImportance" min="1" max="10" value="8" style="max-width:70px" title="Importance 1–10" />
      </div>
      <button class="primary" style="align-self:flex-start" onclick="addGoalFromForm()">Add goal</button>
    </div>
  `;
}

function renderYearlyInner() {
  const goals = state.yearlyGoals;
  const total = goals.length;
  const done = goals.filter(g => g.done).length;
  const completionPct = total ? Math.round((done / total) * 100) : 0;
  const now = new Date();
  const doy = dayOfYear(now);
  const totalDays = daysInYear(now.getFullYear());
  const yearPct = Math.round((doy / totalDays) * 100);
  const paceDiff = completionPct - yearPct;
  const paceLabel = Math.abs(paceDiff) <= 3 ? "right on pace" : paceDiff > 0 ? `${paceDiff}% ahead of pace` : `${Math.abs(paceDiff)}% behind pace`;
  const rows = goals.map(g => `
    <div class="goal-row">
      <div class="task-check ${g.done ? "done" : ""}" onclick="toggleYearlyGoal(${g.id})" style="cursor:pointer">${g.done ? "✓" : ""}</div>
      <span class="goal-desc">${esc(g.desc)}${g.done ? `<span class="goal-sub">Completed ${esc(g.completedDate)} · +50 pts</span>` : ""}</span>
    </div>`).join("");
  return `
    <div class="yearly-header">
      <div class="yearly-count fraunces">${done} / ${total}</div>
      <div class="yearly-sub">2026 goals achieved</div>
    </div>
    <div class="pace-track" title="Fill = goals completed. Marker = where you'd be if perfectly on pace with the calendar.">
      <div class="pace-fill" style="width:${completionPct}%"></div>
      <div class="pace-marker" style="left:${yearPct}%"></div>
    </div>
    <div class="pace-label">${yearPct}% of 2026 gone · you're ${paceLabel}</div>
    <div class="yearly-list">${rows}</div>
    <div class="expand-panel" style="margin-top:16px">
      <span class="detail-label">Add a new yearly goal</span>
      <input type="text" id="newYearlyGoal" placeholder="e.g. Learn calligraphy" onkeydown="if(event.key==='Enter'){addYearlyGoal(this.value); this.value='';}" />
      <button class="primary" style="align-self:flex-start" onclick="const el=document.getElementById('newYearlyGoal'); addYearlyGoal(el.value); el.value='';">Add</button>
    </div>
  `;
}

function render() {
  const app = document.getElementById("app");
  const c = computed();
  app.innerHTML = `
    <div class="sky-deco"></div>
    <div class="sky-cloud" style="top:-20px;left:10%;width:180px;height:90px"></div>
    <div class="sky-cloud" style="top:0px;left:60%;width:220px;height:100px;animation-delay:6s"></div>

    <div class="header">
      <div class="moon-col">
        <div class="moon-ring" onclick="showCycle=!showCycle; render();" title="Tap to set your cycle">
          <div class="moon-body"></div>
          <div class="moon-shadow" id="moonShadow" style="transform:translateX(${c.moonPhase.pct}%)"></div>
        </div>
        <div class="moon-caption">${c.moonPhase.name}</div>
      </div>
      <div class="header-text">
        <div class="day-type-badge">${(new Date().getDay()===1||new Date().getDay()===4) ? "Fasting Day" : "Non-Fasting Day"}</div>
        ${c.cycleInfo ? `<div class="phase-badge">${c.cycleInfo.phase} Phase</div>` : ""}
        <h1 class="fraunces">Noor's Life</h1>
        <div class="header-sub">${new Date().toLocaleDateString(undefined,{weekday:'long', month:'short', day:'numeric'})}</div>
        <div class="header-stats" id="headerStats">${c.cycleInfo?`${c.cycleInfo.phase} · day ${c.cycleInfo.cycleDay}`:"cycle not set"} · ${c.doneCount}/${c.total} today · ${state.streak}-night streak</div>
      </div>
    </div>

    <input class="theme-line" type="text" placeholder="Name today…" value="${esc(state.dailyThemes[state.date]||"")}" onchange="setTheme(this.value)" />

    ${showCycle ? `
    <div class="expand-panel">
      ${c.cycleInfo ? `<span class="detail-label">Based on ${c.cycleInfo.cyclesUsed || state.periodHistory.length} logged cycles: ~${c.cycleInfo.avgCycleLength}-day cycle, ~${c.cycleInfo.avgPeriodLength}-day period. Your history is irregular in places, so treat this as a best estimate, not a guarantee.</span>` : `<span class="detail-label">No history yet — log your first period below, or import your export from another tracker.</span>`}
      <div class="detail-row">
        <button class="ghost" onclick="logPeriodStart()">I got my period today</button>
        ${state.periodHistory.length && !state.periodHistory[state.periodHistory.length-1].end ? `<button class="ghost" onclick="logPeriodEnd()">My period ended today</button>` : ""}
      </div>
      <a class="focus-home-app" style="align-self:flex-start" href="${appLaunchUrl('Period Calendar')}">Check Period Calendar ↗</a>
      <span class="toggle-line" onclick="showPeriodImport=!showPeriodImport; renderPlan();" style="margin-top:8px">${showPeriodImport?"hide import":"+ import history from a text export"}</span>
      ${showPeriodImport ? `
      <div style="margin-top:8px">
        <span class="detail-label">Paste export text (Date [tab] Period Starts / Period Ends per line). Stays on this device only — never saved to any file.</span>
        <textarea id="periodImportText" rows="4" placeholder="Nov 21, 2020	Period Starts
Nov 26, 2020	Period Ends
..."></textarea>
        <button class="ghost" style="margin-top:6px" onclick="importPeriodHistory()">Import</button>
      </div>` : ""}
    </div>` : ""}

    <div class="nav-tabs">
      <button class="nav-tab ${view==='focus'?'active':''}" onclick="view='focus'; render();">Focus</button>
      <button class="nav-tab ${view==='plan'?'active':''}" onclick="view='plan'; render();">Plan</button>
      <button class="nav-tab ${view==='goals'?'active':''}" onclick="view='goals'; render();">Life Goals</button>
      <button class="nav-tab ${view==='yearly'?'active':''}" onclick="view='yearly'; render();">2026 Goals</button>
    </div>

    <div id="viewRoot">
      ${view==='focus' ? renderFocus() : view==='plan' ? renderPlanInner() : view==='yearly' ? renderYearlyInner() : renderGoalsInner()}
    </div>

    <div class="offline-note">Runs fully offline · location used only for prayer times and the sky</div>
  `;
}
function renderPlan() { document.getElementById("viewRoot").innerHTML = renderPlanInner(); }
function renderGoals() { document.getElementById("viewRoot").innerHTML = renderGoalsInner(); }
function renderYearly() { document.getElementById("viewRoot").innerHTML = renderYearlyInner(); }

/* expose functions used by inline handlers */
window.toggleDone = toggleDone; window.markMissed = markMissed; window.delTask = delTask;
window.updateTask = updateTask; window.setTheme = setTheme; window.setCycle = setCycle;
window.addLifeGoal = addLifeGoal; window.closeOut = closeOut; window.focusDone = focusDone;
window.setObsidianVault = setObsidianVault;
window.analyzeWithClaude = analyzeWithClaude;
window.meow = meow;
window.logPeriodStart = logPeriodStart;
window.logPeriodEnd = logPeriodEnd;
window.importPeriodHistory = importPeriodHistory;
window.toggleYearlyGoal = toggleYearlyGoal;
window.addYearlyGoal = addYearlyGoal;
window.renderYearly = renderYearly;
window.focusSkip = focusSkip; window.addQuickTask = addQuickTask; window.addGoalFromForm = addGoalFromForm;
window.toggleTimer = toggleTimer; window.resetTimer = resetTimer; window.render = render;
window.renderPlan = renderPlan; window.renderGoals = renderGoals;
Object.defineProperty(window, "view", { get:()=>view, set:v=>view=v });
Object.defineProperty(window, "expandedId", { get:()=>expandedId, set:v=>expandedId=v });
Object.defineProperty(window, "showCycle", { get:()=>showCycle, set:v=>showCycle=v });
Object.defineProperty(window, "showTimer", { get:()=>showTimer, set:v=>showTimer=v });
Object.defineProperty(window, "showObsidian", { get:()=>showObsidian, set:v=>showObsidian=v });
Object.defineProperty(window, "showPeriodImport", { get:()=>showPeriodImport, set:v=>showPeriodImport=v });
Object.defineProperty(window, "showAdvancedAdd", { get:()=>showAdvancedAdd, set:v=>showAdvancedAdd=v });
Object.defineProperty(window, "goalFilter", { get:()=>goalFilter, set:v=>goalFilter=v });
Object.defineProperty(window, "reflectOpen", { get:()=>reflectOpen, set:v=>reflectOpen=v });

render();
resolveLocation();
clearStaleTasks();
setInterval(clearStaleTasks, 5*60*1000);

if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("service-worker.js").catch(() => {});
  });
}
})();
</script>
</body>
</html>
